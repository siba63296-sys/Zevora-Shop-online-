    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('zevora_theme_mode') || localStorage.getItem('zevora_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (prefersDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
